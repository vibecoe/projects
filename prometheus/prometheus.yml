global:
  scrape_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

scrape_configs:
  - job_name: 'webAppSuite'
    static_configs:
      - targets: ['<your-app-server-ip>:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['<your-app-server-ip>:9100']