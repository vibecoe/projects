---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webAppSuite-config
data:
  db_host: <db_host>
  db_port: "3306"
  db_name: webAppSuite

---
apiVersion: v1
kind: Secret
metadata:
  name: webAppSuite-secret
type: Opaque
data:
  db_password: <db_password_base64>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webAppSuite-app
  labels:
    app: webAppSuite-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webAppSuite-app
  template:
    metadata:
      labels:
        app: webAppSuite-app
    spec:
      containers:
      - name: webAppSuite-app
        image: webAppSuite/webAppSuite-app:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: webAppSuite-config
        - secretRef:
            name: webAppSuite-secret

---
apiVersion: v1
kind: Service
metadata:
  name: webAppSuite-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: webAppSuite-app
